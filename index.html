<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ميزان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: right-hand rail (RTL start) + one content column; on phones the rail becomes a slim top bar and a five-slot tab bar sits at the bottom.
   Palette: cool ink-green neutrals, petrol-teal brand, three fixed bucket hues (needs blue, wants amber, savings green). */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface2:#F6F9F8; --ink:#13201E; --muted:#58686A; --line:#DCE5E3;
  --brand:#0B5D52; --brand-ink:#FFFFFF; --brand-soft:#DDF0EB;
  --needs:#3567C9; --wants:#C97A1C; --save:#228A5C;
  --good:#1E7F55; --warn:#9A5F08; --bad:#B3322A;
  --good-soft:#DDF1E6; --warn-soft:#FBEBD0; --bad-soft:#F9E1DE;
  --c1:#3B6FD0; --c2:#D98A2B; --c3:#2E9E6B; --c4:#8A5BC9; --c5:#D2566B; --c6:#1B9AAA; --c7:#8C7B3A; --c8:#6B7C93;
  --scrim:rgba(10,20,18,.5);
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1514; --surface:#162120; --surface2:#1B2928; --ink:#E4EEEB; --muted:#9AAAA7; --line:#27373A;
    --brand:#3FB8A3; --brand-ink:#05201B; --brand-soft:#16332E;
    --needs:#7AA3F2; --wants:#EBA84E; --save:#52C58C;
    --good:#4CC38A; --warn:#E3A53D; --bad:#F2857A;
    --good-soft:#143226; --warn-soft:#3A2D12; --bad-soft:#3C1E1B;
    --c1:#7AA3F2; --c2:#EBA84E; --c3:#52C58C; --c4:#B391E8; --c5:#F08CA0; --c6:#52C2D1; --c7:#C8B766; --c8:#9DAEC4;
    --scrim:rgba(0,0,0,.62); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#162120; --surface2:#1B2928; --ink:#E4EEEB; --muted:#9AAAA7; --line:#27373A;
  --brand:#3FB8A3; --brand-ink:#05201B; --brand-soft:#16332E;
  --needs:#7AA3F2; --wants:#EBA84E; --save:#52C58C;
  --good:#4CC38A; --warn:#E3A53D; --bad:#F2857A;
  --good-soft:#143226; --warn-soft:#3A2D12; --bad-soft:#3C1E1B;
  --c1:#7AA3F2; --c2:#EBA84E; --c3:#52C58C; --c4:#B391E8; --c5:#F08CA0; --c6:#52C2D1; --c7:#C8B766; --c8:#9DAEC4;
  --scrim:rgba(0,0,0,.62); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.cur{color:var(--muted);font-size:.82em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.bold{font-weight:600}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;padding:22px 14px;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--brand)}
.logo svg{width:30px;height:30px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.sidebtn{display:flex;align-items:center;gap:11px;padding:9px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);text-align:start;font-weight:500;white-space:nowrap;width:100%}
.nav button svg,.sidebtn svg{width:20px;height:20px;flex:none}
.nav button:hover,.sidebtn:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:10px}
.sync{padding:11px 12px;border-radius:10px;background:var(--surface2);font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:7px}
.sync[data-s="cloud"] i{background:var(--good)} .sync[data-s="error"] i{background:var(--bad)}
.side .topact{display:none}

.main{padding:26px 32px 120px;min-width:0}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.2}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.monthnav b{min-width:116px;text-align:center;font-weight:600}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.del:hover{color:var(--bad)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.qa{display:flex;gap:8px;align-items:stretch}
.qa input{flex:1;min-width:0;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px}
.qa input:focus{outline:0;border-color:var(--brand)}
.qa .btn{padding-inline:18px;border-radius:14px}
.qap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:12px;background:var(--brand-soft);margin-top:8px}
.qap select{width:auto;min-width:140px;padding:6px 10px}
.qap .t{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--muted)}
.chipb:hover{border-color:var(--brand);color:var(--ink)}
.qahint{font-size:12.5px;color:var(--muted);margin-top:7px}

.hero{display:flex;flex-wrap:wrap;gap:14px 40px;align-items:flex-end;padding:4px 0 0}
.hero .big{font-size:42px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.hero .big.neg{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.kpi{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi+.kpi{border-inline-start:1px solid var(--line)}
.kpi .v{font-size:21px;font-weight:600}
.kpi .l{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.kpi:nth-child(odd){border-inline-start:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h2{font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}

.bar{height:9px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.over i{background:var(--bad)}
.bkt{display:flex;flex-direction:column;gap:7px;padding:12px 0}
.bkt+.bkt{border-top:1px solid var(--line)}
.bkt .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.bkt .t{font-weight:600;display:flex;align-items:center;gap:8px}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.b-needs{background:color-mix(in srgb,var(--needs) 15%,transparent);color:color-mix(in srgb,var(--needs) 78%,var(--ink))}
.b-wants{background:color-mix(in srgb,var(--wants) 17%,transparent);color:color-mix(in srgb,var(--wants) 70%,var(--ink))}
.b-savings{background:color-mix(in srgb,var(--save) 16%,transparent);color:color-mix(in srgb,var(--save) 75%,var(--ink))}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1;min-width:0}

.in{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
input[type=number].in,input[type=date].in{direction:ltr;text-align:right}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.err{color:var(--bad);font-size:13px;min-height:20px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--brand)}

.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.dayh:first-child{padding-top:0}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dayh+.tx{border-top:0}
.tx-main{flex:1;min-width:0}
.tx-note{font-weight:500;overflow-wrap:anywhere}
.tx-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tx-amt{font-weight:600;white-space:nowrap}
.tx-amt.pos{color:var(--good)}
.tx-act{display:flex;gap:0;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wants);display:inline-block}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .in:first-child{grid-column:1/-1}}

.cat{display:grid;grid-template-columns:minmax(0,1.3fr) 112px minmax(0,1.4fr) auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cat .nm{display:flex;align-items:center;gap:9px;min-width:0}
.cat .nm input{border:0;background:transparent;font-weight:500;width:100%;padding:4px 0;border-bottom:1px dashed transparent;min-width:0}
.cat .nm input:hover,.cat .nm input:focus{border-bottom-color:var(--line);outline:0}
.cat .pg{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.cat{grid-template-columns:minmax(0,1fr) 108px auto}.cat .pg{grid-column:1/-1;order:5}}

.goal{display:flex;flex-direction:column;gap:12px}
.goal h3{font-size:17px;font-weight:600}
.goal .pct{font-size:30px;font-weight:700;line-height:1}
.ins{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ins:first-child{border-top:0;padding-top:0}
.ins .sv{width:4px;border-radius:4px;flex:none;background:var(--muted)}
.ins.bad .sv{background:var(--bad)} .ins.warn .sv{background:var(--wants)} .ins.good .sv{background:var(--good)} .ins.info .sv{background:var(--needs)}
.ins b{display:block;font-weight:600}
.ins .rule{font-size:12px;color:var(--muted);margin-top:2px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--wants) 40%,transparent)}
.banner.info{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.chart{width:100%;min-height:200px}
.chart svg{display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.donutrow{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donutlist{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.donutlist button{display:flex;align-items:center;gap:9px;font-size:13.5px;border:0;background:transparent;padding:5px 6px;border-radius:8px;text-align:start;width:100%}
.donutlist button:hover{background:var(--surface2)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:start;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12.5px;border-top:0}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{border:1px solid var(--line);border-radius:9px;background:var(--surface);min-height:52px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1px;font-size:11px;color:var(--muted)}
.cal .d b{font-size:12.5px;font-weight:600;color:var(--ink)}
.cal .d.t{outline:2px solid var(--brand);outline-offset:-1px}
.cal .d.e{visibility:hidden;border:0}
.cal .d.f{opacity:.45}
.cal button.d:hover{border-color:var(--brand)}

.ring{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring .sc{font-size:28px;font-weight:700;line-height:1}
.hp{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-top:1px solid var(--line)}
.hp .r{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.wk{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:11.5px;color:var(--muted)}
.wk i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:var(--brand)}

.fab{position:fixed;inset-inline-end:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border:0;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab svg{width:20px;height:20px}
.tabs{display:none}
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal h2{font-family:var(--f-display);font-size:22px;font-weight:700}
.modal .hd{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;inset-inline:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);padding:10px 18px;border-radius:12px;background:var(--ink);color:var(--bg);z-index:60;font-weight:500}
.toast .btn{color:var(--ink)}
.rv{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.rv .amt{font-size:38px;font-weight:700}
.rv .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rv .btns button{padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center}
.rv .btns small{font-weight:400;color:var(--muted);font-size:12px}
.rv .btns button:hover{border-color:var(--brand)}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}

.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:22px;border-radius:99px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:start;width:100%}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block}
.opt .pr{display:flex;gap:6px;margin-top:6px}
.opt .pr span{font-size:12px;padding:1px 9px;border-radius:99px}
.guide li{margin-bottom:8px}
.moregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.moregrid button{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-weight:500;text-align:start}
.moregrid svg{width:22px;height:22px;color:var(--brand)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:30;flex-direction:row;align-items:center;gap:6px;padding:8px 14px;border-inline-end:0;border-bottom:1px solid var(--line);overflow:visible}
  .logo{padding:0;font-size:22px;flex:1} .logo svg{width:24px;height:24px}
  .nav,.sidefoot{display:none}
  .side .topact{display:inline-grid}
  .main{padding:16px 16px 130px}
  .top h1{font-size:25px}
  .hero .big{font-size:34px}
  .fab{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:500;padding:5px 0}
  .tabs button svg{width:22px;height:22px}
  .tabs button[aria-current="page"]{color:var(--brand)}
  .tabs .add{width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--brand-ink);margin:-20px auto 0;box-shadow:0 5px 16px rgba(0,0,0,.28);justify-content:center}
  .tabs .add svg{width:26px;height:26px}
  .cal .d{min-height:46px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
details.more{margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.more summary{cursor:pointer;font-weight:500;font-size:14px}
details.more[open] summary{margin-bottom:10px}
.plbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:10px 0 16px;background:var(--surface2)}

function txMonths(){var o={};S.tx.forEach(function(t){o[t.date.slice(0,7)]=1});return Object.keys(o)}
function persistAll(oldMonths){

 (oldMonths||[]).forEach(function(m){seen[m]=1});
 Object.keys(seen).forEach(function(m){sync.dirty['tx:'+m]=1});
 if(sync.db){clearTimeout(sync.timer);sync.timer=setTimeout(flush,400)}
}
function docRef(id){return sync.db.collection('data/users/'+sync.uid).doc(id)}
async function flush(){
 if(!sync.db||!sync.uid)return;
 if(sync.busy){sync.timer=setTimeout(flush,400);return}
 sync.busy=true;
 var kinds=[];
 try{
  if(!sync.remoteHas){sync.dirty.meta=1;txMonths().forEach(function(m){sync.dirty['tx:'+m]=1})}
  kinds=Object.keys(sync.dirty);sync.dirty={};
  for(var i=0;i<kinds.length;i++){
   var k=kinds[i];
   if(k==='meta')await docRef('settings').set({v:2,settings:S.settings,cats:S.cats,goals:S.goals,subs:S.subs,rules:S.rules,accts:S.accts,debts:S.debts});
   else{
    var m=k.slice(3),items=S.tx.filter(function(t){return t.date.slice(0,7)===m}),old=sync.chunks[m]||0;
    if(!items.length){for(var z=0;z<Math.max(old,1);z++)await docRef(z===0?'tx_'+m:'tx_'+m+'_'+z).delete();sync.chunks[m]=0}
    else{
     var n=Math.ceil(items.length/CHUNK);
     for(var c=0;c<n;c++)await docRef(c===0?'tx_'+m:'tx_'+m+'_'+c).set({items:items.slice(c*CHUNK,(c+1)*CHUNK)});
     for(var e=n;e<old;e++)await docRef('tx_'+m+'_'+e).delete();
     sync.chunks[m]=n;
    }
   }
  }
  sync.remoteHas=true;setStatus('cloud');
 }catch(e){kinds.forEach(function(k){sync.dirty[k]=1});setStatus('error')}
 finally{sync.busy=false}
}
async function connect(){

  if(!window.claude||!window.claude.use)return;
  var res=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
  var user=res[0],db=res[1];
  if(!user||!db)return;
  var id=await user.id();if(!id)return;
  sync.db=db;sync.uid=id;
  var snap=await db.collection('data/users/'+id).get();
  var meta=null,tx=[];
  snap.docs.forEach(function(d){
   var x=d.data();if(!x)return;
   x=JSON.parse(JSON.stringify(x));
   if(d.id==='settings')meta=x;
   else{
    var mm=d.id.match(/^tx_(\d{4}-\d{2})(?:_(\d+))?$/);
    if(mm&&Array.isArray(x.items)){tx=tx.concat(x.items);var ci=(mm[2]?+mm[2]:0)+1;sync.chunks[mm[1]]=Math.max(sync.chunks[mm[1]]||0,ci)}
   }
  });
  if(meta){
   S=normalize({settings:meta.settings,cats:meta.cats,goals:meta.goals,subs:meta.subs,rules:meta.rules,accts:meta.accts,debts:meta.debts,tx:tx});
   sync.remoteHas=true;applyTheme();autoSubs();render();
   try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  }else if(S&&S.settings.onboarded!==false&&(S.tx.length||S.accts.length)){persistAll()}
  setStatus('cloud');
 }catch(e){sync.db=null;setStatus('local')}
}

function stats(m){

/* debt payoff simulation */
function simulateDebts(debts,extra,method){
 var ds=debts.filter(function(d){return d.balance>0}).map(function(d){return {id:d.id,bal:d.balance,rate:d.rate||0,min:d.min||0,done:null}});
 if(!ds.length)return {months:0,interest:0,per:{},never:false};
 var months=0,interest=0;
 while(ds.some(function(d){return d.bal>0.005})&&months<600){
  months++;
  ds.forEach(function(d){if(d.bal>0.005){var i=d.bal*d.rate/1200;d.bal+=i;interest+=i}});
  var pool=extra;
  ds.forEach(function(d){
   if(d.bal>0.005){var p=Math.min(d.min,d.bal);d.bal-=p;pool+=d.min-p}else pool+=d.min;
  });
  var order=ds.filter(function(d){return d.bal>0.005}).sort(function(a,b){return method==='snowball'?a.bal-b.bal:b.rate-a.rate});
  order.forEach(function(d){var p=Math.min(pool,d.bal);d.bal-=p;pool-=p});
  ds.forEach(function(d){if(d.bal<=0.005&&d.done===null)d.done=months});
 }
 var per={};ds.forEach(function(d){per[d.id]=d.done});
 return {months:months,interest:interest,per:per,never:ds.some(function(d){return d.bal>0.005})};
}

var HDR_RES=[/تاريخ|date/i,/وصف|بيان|تفاصيل|description|details|memo|narrat|merchant|payee|reference/i,/مبلغ|amount|قيمة|value/i,/مدين|سحب|debit|withdraw/i,/دائن|إيداع|ايداع|credit|deposit/i,/رصيد|balance/i];
/* statements often start with account info lines: find where the table really begins */
function findStart(rows){
 var n=Math.min(rows.length,60),i;
 for(i=0;i<n;i++){
  var cells=rows[i].filter(function(c){return String(c).trim()!==''});
  if(cells.length<3)continue;
  var sc=0;HDR_RES.forEach(function(re){if(cells.some(function(c){return re.test(String(c))&&String(c).length<40}))sc++});
  if(sc>=2)return {i:i,hdr:true};
 }
 for(i=0;i<n;i++)if(rows[i].some(function(c){return pDate(c,'dmy')})&&rows[i].length>=2)return {i:i,hdr:false};
 return {i:0,hdr:false};
}
/* when the amount column has no sign, the running balance tells whether each row was money in or out */
function fixSigns(rows,start,map,fmt){
 if(map.amt<0||map.bal<0||map.deb>=0||map.cre>=0)return 0;
 var body=rows.slice(start),neg=false,list=[];
 body.forEach(function(r,i){
  var a=numOf(r[map.amt]),b=numOf(r[map.bal]);
  if(a<0)neg=true;
  list.push({a:Math.abs(a),b:b,i:i});
 });
 if(neg)return 0;
 var best=0,bestSg=null,bestDir=0;
 [1,-1].forEach(function(dir){
  var m=0,sg={};
  list.forEach(function(x,k){
   var p=list[k-dir];if(!p||isNaN(x.b)||isNaN(p.b)||isNaN(x.a))return;
   var d=x.b-p.b;
   if(Math.abs(Math.abs(d)-x.a)<0.011){m++;sg[x.i]=d<0?-1:1}
  });
  if(m>best){best=m;bestSg=sg;bestDir=dir}
 });
 var valid=list.filter(function(x){return !isNaN(x.b)&&!isNaN(x.a)}).length;
 if(!bestSg||best<Math.max(2,valid*.5))return 0;
 body.forEach(function(r,i){
  var s=bestSg[i];
  /* the first row has no earlier balance to compare with: most statement rows are spending, so default to that */
  r[map.amt]=String((s||-1)*list[i].a);
 });
 return best;
}
/* PDF text lines -> rows [date, description, amount, balance] */
function pdfLinesToRows(lines){
 var dateRe=/(\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4})/,numRe=/-?\d[\d,]*\.\d{2}(?!\d)/g;
 var outA=[],outB=[];
 lines.forEach(function(raw){
  var line=digitsEn(raw).replace(/\s+/g,' ').trim();
  var dm=line.match(dateRe);if(!dm)return;
  var rest=line.replace(dm[0],' ');
  var nums=rest.match(numRe)||[];if(!nums.length)return;
  var desc=rest.replace(numRe,' ').replace(/\b(SAR|SR)\b|ر\.?\s?س/gi,' ').replace(/\s+/g,' ').trim();
  var hint=/مدين|سحب|debit|\bDR\b|purchase|شراء/i.test(line)?-1:(/دائن|إيداع|ايداع|credit|\bCR\b|salary|راتب/i.test(line)?1:1);
  var mk=function(n){
   n=n.map(function(s){return numOf(s)});
   if(n.length>=3){var d=Math.abs(n[0]),c=Math.abs(n[1]);return [dm[0],desc,String(d>0?-d:c),String(n[2])]}
   if(n.length===2)return [dm[0],desc,String(hint*Math.abs(n[0])),String(n[1])];
   return [dm[0],desc,String(hint*Math.abs(n[0])),''];
  };
  outA.push(mk(nums));outB.push(mk(nums.slice().reverse()));
 });
 var head=['التاريخ','الوصف','المبلغ','الرصيد'],map={date:0,desc:1,amt:2,deb:-1,cre:-1,bal:3};
 var score=function(rows){
  var copy=rows.map(function(r){return r.slice()});
  var m=fixSigns(copy,0,map,'dmy');return {m:m,rows:copy};
 };
 var A=score(outA),B=score(outB);
 var pick=B.m>A.m?B:A;
 if(!pick.m)pick={rows:outA};
 return [head].concat(pick.rows);
}

function drawSpend(el,m){
 var W=Math.max(280,el.clientWidth||320),H=220,pl={l:8,r:46,t:14,b:26};
 var n=dim(m),el_=elapsed(m),s=stats(m);
 var cum=[],run=0;

  run+=sumBy(s.list.filter(function(t){return t.type==='exp'&&bucketOf(t)!=='savings'&&+t.date.slice(8)===d}),function(t){return t.amt});
  cum.push(run);
 }
 var plan=s.plan.needs+s.plan.wants;
 var proj=(m===CUR&&el_>=3)?s.spend/el_*n:null;
 var mx=Math.max(plan,run,proj||0,1)*1.08;
 var iw=W-pl.l-pl.r,ih=H-pl.t-pl.b;
 var X=function(d){return W-pl.r-(d-1)/(Math.max(n-1,1))*iw};
 var Y=function(v){return pl.t+ih-(v/mx)*ih};
 var g='';
 for(var i=0;i<=4;i++){var v=mx*i/4;g+='<line x1="'+pl.l+'" x2="'+(W-pl.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(W-pl.r+6)+'" y="'+(Y(v)+4)+'" font-size="11" fill="var(--muted)">'+fmtShort(v)+'</text>'}
 [1,5,10,15,20,25,n].forEach(function(d){g+='<text x="'+X(d)+'" y="'+(H-6)+'" font-size="11" text-anchor="middle" fill="var(--muted)">'+d+'</text>'});
 g+='<line x1="'+X(1)+'" y1="'+Y(0)+'" x2="'+X(n)+'" y2="'+Y(plan)+'" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>';
 var pts=[];for(var k=1;k<=Math.max(el_,0);k++)pts.push(X(k).toFixed(1)+','+Y(cum[k-1]).toFixed(1));
 if(pts.length){
  var area='M'+X(1).toFixed(1)+','+Y(0)+' L'+pts.join(' L')+' L'+X(el_).toFixed(1)+','+Y(0)+' Z';
  g+='<path d="'+area+'" fill="var(--brand)" opacity=".12"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  g+='<circle cx="'+X(el_)+'" cy="'+Y(cum[el_-1])+'" r="4.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="2"/>';
 }
 if(proj){g+='<line x1="'+X(el_)+'" y1="'+Y(cum[el_-1])+'" x2="'+X(n)+'" y2="'+Y(proj)+'" stroke="var(--wants)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>'}
 el.innerHTML=svgWrap(W,H,g);
}

function drawTrend(el,endM,N){

 var iw=W-pl.l-pl.r,ih=H-pl.t-pl.b,gw=iw/N,bw=Math.min(18,gw/4.2);
 var Y=function(v){return pl.t+ih-(Math.max(0,v)/mx)*ih};

var LIBS={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'};
function loadJs(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=function(){res()};s.onerror=function(){rej(new Error('load'))};document.head.appendChild(s)})}
function readXlsx(buf){
 return loadJs(LIBS.xlsx).then(function(){
  var wb=XLSX.read(buf,{type:'array',cellDates:true}),best=null;
  wb.SheetNames.forEach(function(n){
   var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
   if(!best||rows.length>best.length)best=rows;
  });
  return (best||[]).map(function(r){return r.map(function(v){
   if(v instanceof Date){var d=new Date(v.getTime()+43200000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
   return typeof v==='number'?String(v):String(v==null?'':v);
  })}).filter(function(r){return r.some(function(c){return c.trim()!==''})});
 });
}
function readPdf(buf){
 return loadJs(LIBS.pdf).then(function(){

  var name=$('#g-name').value.trim(),target=parseFloat($('#g-target').value),saved=parseFloat($('#g-saved').value)||0,dl=$('#g-dl').value,cat=$('#g-cat').value;
  if(!name||!(target>0)){$('#g-err').textContent='اكتب اسم الهدف ومبلغاً مستهدفاً صحيحاً.';return}
  if(ui.editId){var g=goalById(ui.editId);g.name=name;g.target=target;g.saved=saved;g.deadline=dl;g.cat=cat}
  else S.goals.push({id:genId(),name:name,target:target,saved:saved,deadline:dl,cat:cat});
  closeModal();mutateMeta();
 }else if(id==='cf'){
  var amt=parseFloat($('#c-amt').value),date=$('#c-date').value,g2=goalById(ui.editId);
  if(!(amt>0)||!g2){$('#c-err').textContent='أدخل مبلغاً صحيحاً.';return}
  g2.saved+=amt;
  S.tx.push({id:genId(),date:date,amt:amt,type:'exp',cat:g2.cat||'emergency',note:'مساهمة: '+g2.name,goal:g2.id,bucket:'savings',reviewed:true});
  persist('tx:'+date.slice(0,7));closeModal();mutateMeta();toast('أُضيفت المساهمة');
 }else if(id==='sf'){
  var o={name:$('#s-name').value.trim(),type:$('#s-type').value,amt:parseFloat($('#s-amt').value),cycle:$('#s-cycle').value,day:Math.max(1,Math.min(31,parseInt($('#s-day').value,10)||1)),month:+$('#s-month').value,cat:$('#s-cat').value,active:true};
  if(!o.name||!(o.amt>0)){$('#s-err').textContent='اكتب الاسم والمبلغ.';return}
  if(ui.editId){var x=S.subs.filter(function(s){return s.id===ui.editId})[0];o.active=x.active;Object.assign(x,o)}
  else{o.id=genId();S.subs.push(o)}
  closeModal();mutateMeta();
 }else if(id==='af'){
  var an=$('#a-name').value.trim(),ao=parseFloat($('#a-open').value),as=$('#a-since').value;
  if(!an||isNaN(ao)||!as){$('#a-err').textContent='اكتب اسم الحساب والرصيد وتاريخ البدء.';return}
  var ao2={name:an,kind:$('#a-kind').value,open:ao,since:as};
  if(ui.editId)Object.assign(acctById(ui.editId),ao2);else{ao2.id=genId();S.accts.push(ao2)}
  closeModal();mutateMeta();
 }else if(id==='rf'){
  var a3=acctById(ui.editId),tb=parseFloat($('#r-bal').value);
  if(!a3||isNaN(tb))return;
  a3.open=(+a3.open||0)+(tb-acctBalance(a3));
  closeModal();mutateMeta();toast('تمت التسوية');
 }else if(id==='df'){
  var dn=$('#d-name').value.trim(),db=parseFloat($('#d-bal').value),dr=parseFloat($('#d-rate').value)||0,dm=parseFloat($('#d-min').value)||0;
  if(!dn||!(db>=0)){$('#d-err').textContent='اكتب اسم الدين ورصيده.';return}
  if(ui.editId){var d0=debtById(ui.editId);d0.name=dn;d0.balance=db;d0.rate=dr;d0.min=dm;if(db>(d0.start||0))d0.start=db}
  else S.debts.push({id:genId(),name:dn,balance:db,start:db,rate:dr,min:dm});
  closeModal();mutateMeta();
 }else if(id==='pf'){
  var d1=debtById(ui.editId),pa=parseFloat($('#p-amt').value),pd=$('#p-date').value,pac=$('#p-acct')?$('#p-acct').value:'';
  if(!d1||!(pa>0)||!pd){$('#p-err').textContent='أدخل مبلغاً وتاريخاً صحيحين.';return}
  var pt={id:genId(),date:pd,amt:pa,type:'exp',cat:'loans',note:'دفعة: '+d1.name,debt:d1.id,bucket:'needs',reviewed:true};
  if(pac)pt.acct=pac;
  S.tx.push(pt);linkAdjust(pt,pa);
  persist('tx:'+pd.slice(0,7));closeModal();mutateMeta();toast('سُجّلت الدفعة');
 }
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target&&e.target.id==='qa'){e.preventDefault();qaSave();return}
 if(e.key==='Escape'&&!ui.ob&&$('#layer')&&$('#layer').firstChild){closeModal();return}
 if(ui.review&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){
  var m={ArrowRight:'needs',ArrowLeft:'wants',ArrowDown:'savings',ArrowUp:'skip'}[e.key];
  if(m){e.preventDefault();reviewAct(m)}
 }
});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(drawCharts,150)});

/* ---------- boot ---------- */
var local=loadLocal();
if(local){S=local}else{S=blankState();S.settings.onboarded=false}
autoSubs();
applyTheme();
shell();
render();
connect().then(function(){if(S.settings.onboarded===false&&!sync.remoteHas)openOnboarding()});
})();
</script>
