<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ميزان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: right-hand rail (RTL start) + one content column; on phones the rail becomes a slim top bar and a five-slot tab bar sits at the bottom.
   Palette: cool ink-green neutrals, petrol-teal brand, three fixed bucket hues (needs blue, wants amber, savings green). */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface2:#F6F9F8; --ink:#13201E; --muted:#58686A; --line:#DCE5E3;
  --brand:#0B5D52; --brand-ink:#FFFFFF; --brand-soft:#DDF0EB;
  --needs:#3567C9; --wants:#C97A1C; --save:#228A5C;
  --good:#1E7F55; --warn:#9A5F08; --bad:#B3322A;
  --good-soft:#DDF1E6; --warn-soft:#FBEBD0; --bad-soft:#F9E1DE;
  --c1:#3B6FD0; --c2:#D98A2B; --c3:#2E9E6B; --c4:#8A5BC9; --c5:#D2566B; --c6:#1B9AAA; --c7:#8C7B3A; --c8:#6B7C93;
  --scrim:rgba(10,20,18,.5);
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1514; --surface:#162120; --surface2:#1B2928; --ink:#E4EEEB; --muted:#9AAAA7; --line:#27373A;
    --brand:#3FB8A3; --brand-ink:#05201B; --brand-soft:#16332E;
    --needs:#7AA3F2; --wants:#EBA84E; --save:#52C58C;
    --good:#4CC38A; --warn:#E3A53D; --bad:#F2857A;
    --good-soft:#143226; --warn-soft:#3A2D12; --bad-soft:#3C1E1B;
    --c1:#7AA3F2; --c2:#EBA84E; --c3:#52C58C; --c4:#B391E8; --c5:#F08CA0; --c6:#52C2D1; --c7:#C8B766; --c8:#9DAEC4;
    --scrim:rgba(0,0,0,.62); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#162120; --surface2:#1B2928; --ink:#E4EEEB; --muted:#9AAAA7; --line:#27373A;
  --brand:#3FB8A3; --brand-ink:#05201B; --brand-soft:#16332E;
  --needs:#7AA3F2; --wants:#EBA84E; --save:#52C58C;
  --good:#4CC38A; --warn:#E3A53D; --bad:#F2857A;
  --good-soft:#143226; --warn-soft:#3A2D12; --bad-soft:#3C1E1B;
  --c1:#7AA3F2; --c2:#EBA84E; --c3:#52C58C; --c4:#B391E8; --c5:#F08CA0; --c6:#52C2D1; --c7:#C8B766; --c8:#9DAEC4;
  --scrim:rgba(0,0,0,.62); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.cur{color:var(--muted);font-size:.82em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.bold{font-weight:600}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;padding:22px 14px;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--brand)}
.logo svg{width:30px;height:30px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.sidebtn{display:flex;align-items:center;gap:11px;padding:9px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);text-align:start;font-weight:500;white-space:nowrap;width:100%}
.nav button svg,.sidebtn svg{width:20px;height:20px;flex:none}
.nav button:hover,.sidebtn:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:10px}
.sync{padding:11px 12px;border-radius:10px;background:var(--surface2);font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:7px}
.sync[data-s="cloud"] i{background:var(--good)} .sync[data-s="error"] i{background:var(--bad)}
.side .topact{display:none}

.main{padding:26px 32px 120px;min-width:0}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.2}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.monthnav b{min-width:116px;text-align:center;font-weight:600}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.del:hover{color:var(--bad)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.qa{display:flex;gap:8px;align-items:stretch}
.qa input{flex:1;min-width:0;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px}
.qa input:focus{outline:0;border-color:var(--brand)}
.qa .btn{padding-inline:18px;border-radius:14px}
.qap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:12px;background:var(--brand-soft);margin-top:8px}
.qap select{width:auto;min-width:140px;padding:6px 10px}
.qap .t{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--muted)}
.chipb:hover{border-color:var(--brand);color:var(--ink)}
.qahint{font-size:12.5px;color:var(--muted);margin-top:7px}

.hero{display:flex;flex-wrap:wrap;gap:14px 40px;align-items:flex-end;padding:4px 0 0}
.hero .big{font-size:42px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.hero .big.neg{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.kpi{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi+.kpi{border-inline-start:1px solid var(--line)}
.kpi .v{font-size:21px;font-weight:600}
.kpi .l{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.kpi:nth-child(odd){border-inline-start:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h2{font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}

.bar{height:9px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.over i{background:var(--bad)}
.bkt{display:flex;flex-direction:column;gap:7px;padding:12px 0}
.bkt+.bkt{border-top:1px solid var(--line)}
.bkt .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.bkt .t{font-weight:600;display:flex;align-items:center;gap:8px}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.b-needs{background:color-mix(in srgb,var(--needs) 15%,transparent);color:color-mix(in srgb,var(--needs) 78%,var(--ink))}
.b-wants{background:color-mix(in srgb,var(--wants) 17%,transparent);color:color-mix(in srgb,var(--wants) 70%,var(--ink))}
.b-savings{background:color-mix(in srgb,var(--save) 16%,transparent);color:color-mix(in srgb,var(--save) 75%,var(--ink))}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1;min-width:0}

.in{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
input[type=number].in,input[type=date].in{direction:ltr;text-align:right}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.err{color:var(--bad);font-size:13px;min-height:20px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--brand)}

.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.dayh:first-child{padding-top:0}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dayh+.tx{border-top:0}
.tx-main{flex:1;min-width:0}
.tx-note{font-weight:500;overflow-wrap:anywhere}
.tx-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tx-amt{font-weight:600;white-space:nowrap}
.tx-amt.pos{color:var(--good)}
.tx-act{display:flex;gap:0;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wants);display:inline-block}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .in:first-child{grid-column:1/-1}}

.cat{display:grid;grid-template-columns:minmax(0,1.3fr) 112px minmax(0,1.4fr) auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cat .nm{display:flex;align-items:center;gap:9px;min-width:0}
.cat .nm input{border:0;background:transparent;font-weight:500;width:100%;padding:4px 0;border-bottom:1px dashed transparent;min-width:0}
.cat .nm input:hover,.cat .nm input:focus{border-bottom-color:var(--line);outline:0}
.cat .pg{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.cat{grid-template-columns:minmax(0,1fr) 108px auto}.cat .pg{grid-column:1/-1;order:5}}

.goal{display:flex;flex-direction:column;gap:12px}
.goal h3{font-size:17px;font-weight:600}
.goal .pct{font-size:30px;font-weight:700;line-height:1}
.ins{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ins:first-child{border-top:0;padding-top:0}
.ins .sv{width:4px;border-radius:4px;flex:none;background:var(--muted)}
.ins.bad .sv{background:var(--bad)} .ins.warn .sv{background:var(--wants)} .ins.good .sv{background:var(--good)} .ins.info .sv{background:var(--needs)}
.ins b{display:block;font-weight:600}
.ins .rule{font-size:12px;color:var(--muted);margin-top:2px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--wants) 40%,transparent)}
.banner.info{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.chart{width:100%;min-height:200px}
.chart svg{display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.donutrow{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donutlist{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.donutlist button{display:flex;align-items:center;gap:9px;font-size:13.5px;border:0;background:transparent;padding:5px 6px;border-radius:8px;text-align:start;width:100%}
.donutlist button:hover{background:var(--surface2)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:start;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12.5px;border-top:0}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{border:1px solid var(--line);border-radius:9px;background:var(--surface);min-height:52px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1px;font-size:11px;color:var(--muted)}
.cal .d b{font-size:12.5px;font-weight:600;color:var(--ink)}
.cal .d.t{outline:2px solid var(--brand);outline-offset:-1px}
.cal .d.e{visibility:hidden;border:0}
.cal .d.f{opacity:.45}
.cal button.d:hover{border-color:var(--brand)}

.ring{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring .sc{font-size:28px;font-weight:700;line-height:1}
.hp{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-top:1px solid var(--line)}
.hp .r{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.wk{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:11.5px;color:var(--muted)}
.wk i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:var(--brand)}

.fab{position:fixed;inset-inline-end:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border:0;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab svg{width:20px;height:20px}
.tabs{display:none}
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal h2{font-family:var(--f-display);font-size:22px;font-weight:700}
.modal .hd{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;inset-inline:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);padding:10px 18px;border-radius:12px;background:var(--ink);color:var(--bg);z-index:60;font-weight:500}
.toast .btn{color:var(--ink)}
.rv{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.rv .amt{font-size:38px;font-weight:700}
.rv .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rv .btns button{padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center}
.rv .btns small{font-weight:400;color:var(--muted);font-size:12px}
.rv .btns button:hover{border-color:var(--brand)}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}

.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:22px;border-radius:99px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:start;width:100%}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block}
.opt .pr{display:flex;gap:6px;margin-top:6px}
.opt .pr span{font-size:12px;padding:1px 9px;border-radius:99px}
.guide li{margin-bottom:8px}
.moregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.moregrid button{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-weight:500;text-align:start}
.moregrid svg{width:22px;height:22px;color:var(--brand)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:30;flex-direction:row;align-items:center;gap:6px;padding:8px 14px;border-inline-end:0;border-bottom:1px solid var(--line);overflow:visible}
  .logo{padding:0;font-size:22px;flex:1} .logo svg{width:24px;height:24px}
  .nav,.sidefoot{display:none}
  .side .topact{display:inline-grid}
  .main{padding:16px 16px 130px}
  .top h1{font-size:25px}
  .hero .big{font-size:34px}
  .fab{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:500;padding:5px 0}
  .tabs button svg{width:22px;height:22px}
  .tabs button[aria-current="page"]{color:var(--brand)}
  .tabs .add{width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--brand-ink);margin:-20px auto 0;box-shadow:0 5px 16px rgba(0,0,0,.28);justify-content:center}
  .tabs .add svg{width:26px;height:26px}
  .cal .d{min-height:46px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
details.more{margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.more summary{cursor:pointer;font-weight:500;font-size:14px}
details.more[open] summary{margin-bottom:10px}
.plbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:10px 0 16px;background:var(--surface2)}
.plbar i{display:block;height:100%;transition:width .12s}
.plrow{margin-bottom:12px}

async function flush(){

 var kinds=[];
 try{
  if(!sync.remoteHas){sync.dirty.meta=1;txMonths().forEach(function(m){sync.dirty['tx:'+m]=1})}
  kinds=Object.keys(sync.dirty);sync.dirty={};

   else{
    var m=k.slice(3),items=S.tx.filter(function(t){return t.date.slice(0,7)===m}),old=sync.chunks[m]||0;
    if(!items.length){for(var z=0;z<Math.max(old,1);z++)await docRef(z===0?'tx_'+m:'tx_'+m+'_'+z).delete();sync.chunks[m]=0}
    else{
     var n=Math.ceil(items.length/CHUNK);
     for(var c=0;c<n;c++)await docRef(c===0?'tx_'+m:'tx_'+m+'_'+c).set({items:items.slice(c*CHUNK,(c+1)*CHUNK)});
     for(var e=n;e<old;e++)await docRef('tx_'+m+'_'+e).delete();
     sync.chunks[m]=n;
    }
   }
  }

function stats(m){
 var list=txIn(m),inc=0,b={needs:0,wants:0,savings:0},cat={};
 list.forEach(function(t){
  if(t.type==='inc'){inc+=t.amt;return}
  if(t.type==='xfer'){
   var from=acctById(t.acct),to=acctById(t.to);
   if(isSav(to)&&!isSav(from))b.savings+=t.amt;
   else if(isSav(from)&&!isSav(to))b.savings-=t.amt;
   return;
  }
  var k=bucketOf(t);if(b[k]!=null)b[k]+=t.amt;
  cat[t.cat]=(cat[t.cat]||0)+t.amt;
 });
 var base=(S.settings.base==='actual'&&inc>0)?inc:S.settings.income;
 var plan={};BKS.forEach(function(k){plan[k]=base*S.settings.split[k]/100});
 var cash=inc>0?inc:base;
 var spend=b.needs+b.wants;
 return {m:m,list:list,inc:inc,b:b,cat:cat,base:base,plan:plan,cash:cash,spend:spend,saved:b.savings,left:cash-spend-b.savings,rate:cash?b.savings/cash:0};
}

/* debt payoff simulation */
function simulateDebts(debts,extra,method){
 var ds=debts.filter(function(d){return d.balance>0}).map(function(d){return {id:d.id,bal:d.balance,rate:d.rate||0,min:d.min||0,done:null}});
 if(!ds.length)return {months:0,interest:0,per:{},never:false};
 var months=0,interest=0;
 while(ds.some(function(d){return d.bal>0.005})&&months<600){
  months++;
  ds.forEach(function(d){if(d.bal>0.005){var i=d.bal*d.rate/1200;d.bal+=i;interest+=i}});
  var pool=extra;
  ds.forEach(function(d){
   if(d.bal>0.005){var p=Math.min(d.min,d.bal);d.bal-=p;pool+=d.min-p}else pool+=d.min;
  });
  var order=ds.filter(function(d){return d.bal>0.005}).sort(function(a,b){return method==='snowball'?a.bal-b.bal:b.rate-a.rate});
  order.forEach(function(d){var p=Math.min(pool,d.bal);d.bal-=p;pool-=p});
  ds.forEach(function(d){if(d.bal<=0.005&&d.done===null)d.done=months});
 }
 var per={};ds.forEach(function(d){per[d.id]=d.done});
 return {months:months,interest:interest,per:per,never:ds.some(function(d){return d.bal>0.005})};
}

 var mins=sumBy(S.debts.filter(function(d){return d.balance>0}),function(d){return d.min||0});

 parts.push({name:'الديون',score:p4*25,detail:mins>0?('أقساط الديون '+pctTxt(dti)+' من دخلك. الحد الصحي أقل من 40%.'):'لا توجد ديون مسجلة.',tip:p4<1?'ابدأ خطة سداد من صفحة الديون.':'وضعك سليم.'});

  var ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;
  else if(ch===dl){row.push(cur);cur=''}

  if(!q)return null;

  if(y2<1990||y2>2100||+q[1]<1||+q[1]>31)return null;

function findStart(rows){

  if(cells.length<3)continue;

  if(sc>=2)return {i:i,hdr:true};

 for(i=0;i<n;i++)if(rows[i].some(function(c){return pDate(c,'dmy')})&&rows[i].length>=2)return {i:i,hdr:false};

/* when the amount column has no sign, the running balance tells whether each row was money in or out */
function fixSigns(rows,start,map,fmt){

 body.forEach(function(r,i){
  var a=numOf(r[map.amt]),b=numOf(r[map.bal]);

 });
 if(neg)return 0;
 var best=0,bestSg=null,bestDir=0;
 [1,-1].forEach(function(dir){
  var m=0,sg={};
  list.forEach(function(x,k){
   var p=list[k-dir];if(!p||isNaN(x.b)||isNaN(p.b)||isNaN(x.a))return;
   var d=x.b-p.b;
   if(Math.abs(Math.abs(d)-x.a)<0.011){m++;sg[x.i]=d<0?-1:1}
  });
  if(m>best){best=m;bestSg=sg;bestDir=dir}
 });

var IN_RE=/دائن|إيداع|ايداع|credit|\bcr\b|إضافة|اضافة|وارد|deposit|راتب|salary|refund|استرداد/i,OUT_RE=/مدين|سحب|debit|\bdr\b|خصم|صادر|شراء|دفع|withdraw|purchase|payment/i;

function pdfLinesToRows(lines){

 var ms=[];for(var i=11;i>=0;i--)ms.push(addMonths(CUR,-i));
 var pts=ms.map(function(m){return {m:m,v:netAt(m)}}).filter(function(p){return p.v!==null});
 if(pts.length<2){el.innerHTML='<div class="empty">يظهر الرسم بعد شهرين من تسجيل حساباتك.</div>';return}
 var W=Math.max(280,el.clientWidth||320),H=220,pl={l:8,r:52,t:14,b:26};
 var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
 if(mx===mn){mx+=1;mn-=1}
 var padv=(mx-mn)*.12;mn-=padv;mx+=padv;
 var iw=W-pl.l-pl.r,ih=H-pl.t-pl.b;
 var X=function(m){var idx=ms.indexOf(m);return W-pl.r-(11-idx)/11*iw};
 var Y=function(v){return pl.t+ih-((v-mn)/(mx-mn))*ih};
 var g='';
 for(var k=0;k<=4;k++){var v=mn+(mx-mn)*k/4;g+='<line x1="'+pl.l+'" x2="'+(W-pl.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text direction="ltr" x="'+(W-pl.r+6)+'" y="'+(Y(v)+4)+'" font-size="11" fill="var(--muted)">'+fmtShort(v)+'</text>'}
 var line=pts.map(function(p){return X(p.m).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' L');
 var last=pts[pts.length-1],firstP=pts[0];
 g+='<path d="M'+X(firstP.m).toFixed(1)+','+(pl.t+ih)+' L'+line+' L'+X(last.m).toFixed(1)+','+(pl.t+ih)+' Z" fill="var(--brand)" opacity=".12"/>';
 g+='<polyline points="'+line.replace(/ L/g,' ')+'" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
 g+='<circle cx="'+X(last.m)+'" cy="'+Y(last.v)+'" r="4.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="2"/>';
 [0,3,6,9,11].forEach(function(ix){g+='<text x="'+(W-pl.r-(11-ix)/11*iw)+'" y="'+(H-6)+'" font-size="11" text-anchor="middle" fill="var(--muted)">'+mShort(ms[ix])+'</text>'});
 el.innerHTML=svgWrap(W,H,g);
}

function aiMd(t){

}

var INV_KINDS={stock:'سهم',fund:'صندوق استثمار',etf:'صندوق متداول',sukuk:'صكوك وسندات',reit:'ريت عقاري',gold:'ذهب وسلع',other:'أخرى'};

function invById(id){return S.invs.filter(function(h){return h.id===id})[0]}
/* weighted-average cost: sells use the average cost at the time */
function invPos(h){
 var q=0,cost=0,real=0,div=0,fees=0,bought=0,last=0;
 h.trades.slice().sort(function(a,b){return a.d.localeCompare(b.d)}).forEach(function(t){
  if(t.t==='buy'){var c=t.q*t.p+(t.fee||0);cost+=c;q+=t.q;fees+=t.fee||0;bought+=c;last=t.p}
  else if(t.t==='sell'){var avg=q>0?cost/q:0,sq=Math.min(q,t.q);real+=sq*t.p-(t.fee||0)-sq*avg;cost-=sq*avg;q-=sq;fees+=t.fee||0;last=t.p}
  else if(t.t==='div'){div+=t.a||0}
 });
 if(q<1e-9){q=0;cost=0}
 var price=h.price>0?h.price:last,value=q*price,gain=value-cost;
 return {q:q,cost:cost,avg:q>0?cost/q:0,price:price,value:value,gain:gain,pct:cost>0?gain/cost:0,real:real,div:div,fees:fees,bought:bought};
}
function invTotals(){
 var T={value:0,cost:0,real:0,div:0,bought:0,byKind:{}};
 S.invs.forEach(function(h){var p=invPos(h);T.value+=p.value;T.cost+=p.cost;T.real+=p.real;T.div+=p.div;T.bought+=p.bought;T.byKind[h.kind]=(T.byKind[h.kind]||0)+p.value});
 T.gain=T.value-T.cost;T.total=T.gain+T.real+T.div;T.ret=T.bought>0?T.total/T.bought:0;
 return T;
}
function pushHist(h,price,d){
 if(!(price>0))return;
 h.hist=h.hist||[];
 h.hist=h.hist.filter(function(x){return x.d!==d});
 h.hist.push({d:d,p:price});
 h.hist.sort(function(a,b){return a.d.localeCompare(b.d)});
 if(h.hist.length>90)h.hist=h.hist.slice(-90);
}
function qtyAt(h,d){var q=0;h.trades.slice().sort(function(a,b){return a.d.localeCompare(b.d)}).forEach(function(t){if(t.d>d)return;if(t.t==='buy')q+=t.q;else if(t.t==='sell')q-=t.q});return Math.max(0,q)}
function priceAt(h,d){
 var pts=(h.hist||[]).slice(),buys=h.trades.filter(function(t){return t.t!=='div'&&t.p>0}).sort(function(a,b){return a.d.localeCompare(b.d)});
 buys.forEach(function(t){pts.push({d:t.d,p:t.p})});
 pts.sort(function(a,b){return a.d.localeCompare(b.d)});
 var v=pts.length?pts[0].p:0;pts.forEach(function(x){if(x.d<=d)v=x.p});return v;
}
function invHistory(){
 var ds={};
 S.invs.forEach(function(h){(h.hist||[]).forEach(function(x){ds[x.d]=1});h.trades.forEach(function(t){ds[t.d]=1})});
 var dates=Object.keys(ds).sort();
 return dates.map(function(d){var v=0;S.invs.forEach(function(h){v+=qtyAt(h,d)*priceAt(h,d)});return {d:d,v:v}});
}
function drawLine(el,pts){
 if(pts.length<3){el.innerHTML='<div class="empty">يظهر الرسم بعد تسجيل ثلاث نقاط (عمليات أو تحديثات سعر) في تواريخ مختلفة.</div>';return}
 var W=Math.max(280,el.clientWidth||320),H=190,pl={l:8,r:52,t:12,b:24};

 if(mx===mn){mx+=1;mn-=1}var pad=(mx-mn)*.12;mn=Math.max(0,mn-pad);mx+=pad;
 var iw=W-pl.l-pl.r,ih=H-pl.t-pl.b,n=pts.length;
 var X=function(i){return W-pl.r-(n-1-i)/(n-1)*iw};

 g+='<path d="M'+X(0).toFixed(1)+','+(pl.t+ih)+' L'+line+' L'+X(n-1).toFixed(1)+','+(pl.t+ih)+' Z" fill="var(--brand)" opacity=".12"/><path d="M'+line+'" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linejoin="round"/>';
 g+='<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(pts[n-1].v).toFixed(1)+'" r="4" fill="var(--brand)"/>';
 g+='<text direction="ltr" x="'+pl.l+'" y="'+(H-6)+'" font-size="11" text-anchor="start" fill="var(--muted)">'+dfmt(pts[0].d)+'</text><text direction="ltr" x="'+(W-pl.r)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+dfmt(pts[n-1].d)+'</text>';
 el.innerHTML=svgWrap(W,H,g);
}
function holdingsValue(){return sumBy(S.invs,function(h){return invPos(h).value})}

/* ----- pure calculators ----- */
function growSim(o){
 var rm=Math.pow(1+Math.max(-0.99,(o.r-o.fee)/100),1/12)-1,pmt=o.pmt,bal=o.p,contrib=o.p,rows=[];
 var inf=o.inf/100;
 for(var m=1;m<=o.y*12;m++){
  bal=bal*(1+rm)+pmt;contrib+=pmt;
  if(m%12===0){var y=m/12;rows.push({y:y,bal:bal,contrib:contrib,gain:bal-contrib,real:bal/Math.pow(1+inf,y)});pmt*=1+(o.g||0)/100}
 }
 return rows;
}
function needMonthly(o,target){
 var lo=0,hi=Math.max(1,target/Math.max(1,o.y*12))*4;
 var f=function(pm){var r=growSim({p:o.p,pmt:pm,r:o.r,fee:o.fee,y:o.y,g:0,inf:0});return r.length?r[r.length-1].bal:o.p};
 if(f(0)>=target)return 0;
 for(var i=0;i<60&&f(hi)<target;i++)hi*=2;
 for(i=0;i<60;i++){var mid=(lo+hi)/2;if(f(mid)<target)lo=mid;else hi=mid}
 return hi;
}
function yearsTo(o,target){
 var rm=Math.pow(1+Math.max(-0.99,o.r/100),1/12)-1,bal=o.p;
 if(bal>=target)return 0;
 for(var m=1;m<=1200;m++){bal=bal*(1+rm)+o.pmt;if(bal>=target)return m/12}
 return null;
}
function calcState(){
 var avgSp=0,avgSv=0,n=0;
 for(var i=1;i<=3;i++){var s=stats(addMonths(CUR,-i));if(s.list.length){avgSp+=s.spend;avgSv+=Math.max(0,s.saved);n++}}
 if(n){avgSp/=n;avgSv/=n}
 var d={tab:'grow',p:Math.round(holdingsValue())||10000,pmt:Math.round(avgSv/50)*50||1000,r:7,y:20,g:0,fee:0.5,inf:2,tgt:1000000,spend:Math.round(avgSp/100)*100||6000,swr:4,aq:100,ap:30,bq:50,bp:25,fp:0.155,vat:15,ta:0,tp:10,sp:36,tq:100,cap:50000,risk:1,en:40,stp:37,dp:100000,dy:4,dg:5,pg:5,dyr:15,ri:1};
 S.settings.calc=Object.assign(d,S.settings.calc||{});
 return S.settings.calc;
}
function drawGrowth(el,rows){
 if(!rows.length){el.innerHTML='';return}
 var W=Math.max(280,el.clientWidth||320),H=230,pl={l:8,r:56,t:12,b:28},N=rows.length;
 var mx=Math.max.apply(null,rows.map(function(r){return r.bal}))*1.08,iw=W-pl.l-pl.r,ih=H-pl.t-pl.b,gw=iw/N,bw=Math.max(3,Math.min(26,gw*.7));
 var Y=function(v){return pl.t+ih-(Math.max(0,v)/mx)*ih},g='';

 var step=N>24?5:(N>12?2:1);
 rows.forEach(function(r,i){
  var cx=pl.l+gw*(i+.5),yc=Y(r.contrib),yb=Y(r.bal);
  g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+yc.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,Y(0)-yc).toFixed(1)+'" fill="var(--brand)"><title>مساهماتك '+Math.round(r.contrib)+'</title></rect>';

 });
 el.innerHTML=svgWrap(W,H,g);
}

 if(t==='trade')return '<div class="fgrid cg">'+cfield('bp','سعر الشراء','any',S.settings.cur)+cfield('sp','سعر البيع','any',S.settings.cur)+cfield('tq','الكمية','any','')+cfield('fp','عمولة الوساطة','any','%')+cfield('vat','ضريبة على العمولة','any','%')+'</div><h3 class="subh">حجم المركز حسب المخاطرة</h3><div class="fgrid cg">'+cfield('cap','رأس مالك للتداول','any',S.settings.cur)+cfield('risk','أقصى خسارة للصفقة','any','%')+cfield('en','سعر الدخول','any',S.settings.cur)+cfield('stp','سعر وقف الخسارة','any',S.settings.cur)+'</div>';
 if(t==='div')return '<div class="fgrid cg">'+cfield('dp','المبلغ المستثمر','any',S.settings.cur)+cfield('dy','عائد التوزيعات السنوي','any','%')+cfield('dg','نمو التوزيعات سنوياً','any','%')+cfield('pg','نمو السعر سنوياً','any','%')+cfield('dyr','المدة','1','سنة')+cfield('ri','إعادة استثمار التوزيعات (1 نعم، 0 لا)','1','')+'</div>';
 if(t==='grow')return '<div class="fgrid cg">'+cfield('p','المبلغ الابتدائي','any',S.settings.cur)+cfield('pmt','الاستثمار الشهري','any',S.settings.cur)+cfield('r','العائد السنوي المتوقع','0.1','%')+cfield('y','المدة بالسنوات','1','سنة')+cfield('g','زيادة الاستثمار كل سنة','0.5','%')+cfield('fee','الرسوم السنوية','0.05','%')+cfield('inf','التضخم السنوي','0.1','%')+'</div>';
 if(t==='goal')return '<div class="fgrid cg">'+cfield('tgt','المبلغ المستهدف','any',S.settings.cur)+cfield('p','لديك الآن','any',S.settings.cur)+cfield('y','خلال','1','سنة')+cfield('r','العائد السنوي المتوقع','0.1','%')+cfield('fee','الرسوم السنوية','0.05','%')+'</div>';
 return '<div class="fgrid cg">'+cfield('spend','مصروفك الشهري في التقاعد','any',S.settings.cur)+cfield('swr','نسبة السحب الآمن','0.1','%')+cfield('p','استثماراتك الآن','any',S.settings.cur)+cfield('pmt','ما تستثمره شهرياً','any',S.settings.cur)+cfield('r','العائد السنوي المتوقع','0.1','%')+cfield('inf','التضخم السنوي','0.1','%')+'</div>';
}
function calcResult(){
 var c=calcState(),t=c.tab,h='',rows=[];
 if(t==='avg'||t==='trade'||t==='div')return calcStock(c,t);
 var stat=function(l,v,cls){return '<div class="kpi"><span class="l">'+l+'</span><span class="v'+(cls?' '+cls:'')+'">'+v+'</span></div>'};
 if(t==='grow'){
  rows=growSim(c);var L=rows[rows.length-1];
  if(!L)return {html:'<p class="muted">أدخل مدة أكبر من صفر.</p>',rows:rows};
  var free=growSim(Object.assign({},c,{fee:0})),Lf=free[free.length-1];
  var sc=[c.r-3,c.r,c.r+3].map(function(rr){var q=growSim(Object.assign({},c,{r:Math.max(0,rr)})),z=q[q.length-1];return z?z.bal:0});
  h='<div class="kpis">'+stat('القيمة النهائية',mR(L.bal))+stat('ما دفعته',mR(L.contrib))+stat('أرباح الاستثمار',mR(L.gain),'pos')+'</div>'+
   '<p class="small" style="margin-top:10px">بعد خصم التضخم ('+c.inf+'%) قوتها الشرائية اليوم نحو <b>'+mR(L.real)+'</b>.'+(c.fee>0&&Lf?' الرسوم السنوية ('+c.fee+'%) تكلفك <b>'+mR(Lf.bal-L.bal)+'</b> خلال '+c.y+' سنة.':'')+'</p>'+
   '<div class="tbl" style="margin-top:8px"><table><thead><tr><th>السيناريو</th><th>العائد</th><th>القيمة النهائية</th></tr></thead><tbody><tr><td>متحفظ</td><td>'+Math.max(0,c.r-3)+'%</td><td>'+mR(sc[0])+'</td></tr><tr><td><b>المتوقع</b></td><td>'+c.r+'%</td><td><b>'+mR(sc[1])+'</b></td></tr><tr><td>متفائل</td><td>'+(c.r+3)+'%</td><td>'+mR(sc[2])+'</td></tr></tbody></table></div>';
 }else if(t==='goal'){
  rows=growSim({p:c.p,pmt:0,r:c.r,fee:c.fee,y:c.y,g:0,inf:0});
  var need=needMonthly(c,c.tgt),rm=c.r-c.fee,lump=c.tgt/Math.pow(1+rm/100,c.y);
  var paid=c.p+need*c.y*12;
  h='<div class="kpis">'+stat('تحتاج شهرياً',need>0?mR(need):'لا شيء',need>0?'pos':'')+stat('إجمالي ما ستدفعه',mR(paid))+stat('أو دفعة واحدة اليوم',mR(Math.max(0,lump)))+'</div>'+
   '<p class="small" style="margin-top:10px">'+(need>0?'إذا استثمرت <b>'+plain(need)+'</b> كل شهر بعائد صافٍ '+rm.toFixed(1)+'% تصل إلى '+plain(c.tgt)+' بعد '+c.y+' سنة.':'مبلغك الحالي يكفي وحده للوصول إلى هدفك بهذا العائد.')+'</p>';
  rows=growSim({p:c.p,pmt:need,r:c.r,fee:c.fee,y:c.y,g:0,inf:0});
 }else{
  var tgt=c.spend*12/(c.swr/100),real=((1+c.r/100)/(1+c.inf/100)-1)*100;
  var yrs=yearsTo({p:c.p,pmt:c.pmt,r:real},tgt),prog=tgt>0?Math.min(1,c.p/tgt):0;
  rows=yrs?growSim({p:c.p,pmt:c.pmt,r:real,fee:0,y:Math.min(60,Math.ceil(yrs)),g:0,inf:0}):[];
  h='<div class="kpis">'+stat('رقم الاستقلال المالي',mR(tgt))+stat('تصل إليه بعد',yrs===null?'أكثر من 100 سنة':(yrs===0?'وصلت':(yrs<1?'أقل من سنة':yrs.toFixed(1)+' سنة')),yrs!==null?'pos':'')+stat('تقدمك الآن',Math.round(prog*100)+'%')+'</div>'+
   '<div class="bar" style="margin:12px 0 6px"><i style="width:'+(prog*100)+'%;background:var(--save)"></i></div>'+
   '<p class="small">المبلغ الذي يكفيك لتسحب '+c.swr+'% سنوياً فتغطي '+plain(c.spend)+' شهرياً (قاعدة السحب الآمن، 4% تعني 25 ضعف مصروفك السنوي). الحساب بالقيمة الحقيقية بعد التضخم، أي عائد حقيقي '+real.toFixed(1)+'%. '+(yrs?'وبعمرك الحالي أضف '+Math.ceil(yrs)+' سنة.':'')+'</p>';
 }
 return {html:h,rows:rows};
}

function calcStock(c,t){
 var stat=function(l,v,cls){return '<div class="kpi"><span class="l">'+l+'</span><span class="v'+(cls?' '+cls:'')+'">'+v+'</span></div>'};
 var m2=function(n){return money(Math.round(n*100)/100)},h='',rows=[];
 var f=c.fp/100*(1+(c.vat||0)/100);
 if(t==='avg'){
  var buyCost=c.bq*c.bp*(1+f),q=c.aq+c.bq;
  if(!(q>0)||!(c.bq>=0))return {html:'<p class="muted">أدخل الكمية.</p>',rows:[]};
  var avg=(c.aq*c.ap+buyCost)/q,be=avg/(1-f),tgt=avg*(1+c.tp/100)/(1-f);
  h='<div class="kpis">'+stat('متوسط التكلفة الجديد',m2(avg))+stat('إجمالي الأسهم',fmt(q))+stat('تعادل (بيع بلا خسارة)',m2(be))+'</div>'+
   '<p class="small" style="margin-top:10px">لتحقق ربحاً '+c.tp+'% بعد العمولة يجب أن يصل السعر إلى <b>'+m2(tgt)+'</b>. ستدفع في الشراء الجديد '+m2(buyCost)+' (تشمل عمولة '+m2(buyCost-c.bq*c.bp)+').</p>';
  if(c.ta>0){
   if(c.ta>=c.ap||c.bp>=c.ta)h+='<p class="small" style="color:var(--warn,var(--wants))">لا يمكن الوصول إلى متوسط '+c.ta+' بالشراء بسعر '+c.bp+': يجب أن يكون المتوسط المرغوب بين سعر الشراء ومتوسطك الحالي.</p>';
   else{var x=c.aq*(c.ap-c.ta)/((c.ta-c.bp*(1+f)));h+='<p class="small">لتخفيض متوسطك إلى '+c.ta+' اشترِ نحو <b>'+fmt(Math.ceil(x))+'</b> سهماً بسعر '+c.bp+' (بتكلفة نحو '+mR(Math.ceil(x)*c.bp*(1+f))+').</p>'}
  }
 }else if(t==='trade'){
  var bc=c.bp*c.tq,sc=c.sp*c.tq,fees=(bc+sc)*f,net=sc-bc-fees,roi=bc>0?net/(bc+bc*f):0,be2=c.bp*(1+f)/(1-f);
  h='<div class="kpis">'+stat('صافي الربح',(net>=0?'+':'')+m2(net),net>=0?'pos':'neg')+stat('العائد',(roi*100).toFixed(2)+'%',net>=0?'pos':'neg')+stat('إجمالي العمولات',m2(fees))+'</div>'+
   '<p class="small" style="margin-top:10px">سعر التعادل (بيع بلا ربح ولا خسارة بعد العمولتين): <b>'+m2(be2)+'</b>.</p>';
  var rk=c.cap*c.risk/100,per=c.en-c.stp;
  if(per>0&&c.cap>0){var qn=Math.floor(rk/per);h+='<h3 class="subh">حجم المركز</h3><div class="kpis">'+stat('أقصى كمية',fmt(qn)+' وحدة')+stat('قيمة المركز',mR(qn*c.en))+stat('نسبة من رأس المال',(qn*c.en/c.cap*100).toFixed(1)+'%')+'</div><p class="small" style="margin-top:8px">إذا نزل السعر إلى وقف الخسارة تخسر نحو '+mR(qn*per)+' ('+(qn*per/c.cap*100).toFixed(2)+'% من رأس مالك).</p>'}
  else h+='<p class="small muted">لحساب حجم المركز اجعل سعر الدخول أعلى من سعر وقف الخسارة.</p>';
 }else{
  var val=c.dp,tot=0,inc=0,yrs=Math.max(0,Math.min(60,Math.round(c.dyr))),rate=c.dy;
  for(var y=1;y<=yrs;y++){
   inc=val*(rate/100);tot+=inc;
   var cont=c.dp;
   val=val*(1+c.pg/100)+(c.ri?inc:0);
   rate=rate*(1+(c.dg-c.pg)/100);if(rate<0)rate=0;
   rows.push({y:y,contrib:cont,bal:val,gain:val-cont,real:val});
  }
  var yoc=c.dp>0?inc/c.dp*100:0;
  h='<div class="kpis">'+stat('دخل السنة الأخيرة',mR(inc)+' / سنة','pos')+stat('إجمالي التوزيعات',mR(tot))+stat('القيمة النهائية',mR(val))+'</div>'+
   '<p class="small" style="margin-top:10px">عائد التوزيعات على تكلفتك الأصلية في السنة الأخيرة نحو <b>'+yoc.toFixed(1)+'%</b>، أي نحو '+mR(inc/12)+' شهرياً. '+(c.ri?'التوزيعات تُعاد استثمارها.':'التوزيعات تُصرف ولا تُعاد استثمارها.')+'</p>';
 }
 return {html:h,rows:rows};
}

/* ----- rebalance ----- */
function rbPlan(){
 var T=invTotals(),tg=S.settings.invTarget||{},nm=Math.max(0,parseFloat(ui.rbm)||0);
 var ks=Object.keys(INV_KINDS).filter(function(k){return (T.byKind[k]||0)>0||(tg[k]||0)>0});
 var sum=0;ks.forEach(function(k){sum+=tg[k]||0});
 var tot=T.value+nm,rows=ks.map(function(k){var cur=T.byKind[k]||0,t=(tg[k]||0)/100*tot;return {k:k,cur:cur,pct:T.value?cur/T.value*100:0,tg:tg[k]||0,diff:t-cur}});
 var short=0;rows.forEach(function(r){if(r.diff>0)short+=r.diff});
 rows.forEach(function(r){r.buy=short>0&&r.diff>0?(nm>0?nm*r.diff/short:0):0});
 return {rows:rows,sum:sum,nm:nm,T:T};
}
function rbOut(){
 var P=rbPlan(),h='';
 if(Math.abs(P.sum-100)>0.5)h+='<p class="small '+(P.sum?'neg':'muted')+'">مجموع النسب المستهدفة '+Math.round(P.sum)+'% — يجب أن يساوي 100%.</p>';
 if(Math.abs(P.sum-100)<=0.5){
  h+='<div class="tbl"><table><thead><tr><th>الفئة</th><th>الآن</th><th>الهدف</th><th>التعديل</th>'+(P.nm?'<th>من الجديد</th>':'')+'</tr></thead><tbody>'+P.rows.map(function(r){var d=Math.round(r.diff);return '<tr><td>'+esc(INV_KINDS[r.k])+'</td><td>'+Math.round(r.pct)+'%</td><td>'+r.tg+'%</td><td class="'+(d>0?'pos':d<0?'neg':'')+'">'+(d>0?'شراء ':d<0?'بيع ':'')+(d?fmt(Math.abs(d)):'متوازن')+'</td>'+(P.nm?'<td>'+(r.buy>=1?fmt(Math.round(r.buy)):'—')+'</td>':'')+'</tr>'}).join('')+'</tbody></table></div>';
  h+='<p class="small muted" style="margin-top:8px">«التعديل» يعني الشراء/البيع للوصول للنسبة بالضبط. وإن أردت عدم البيع، ضع مبلغاً جديداً وسيُوزَّع على الفئات الناقصة فقط.</p>';
 }
 return h;
}

 var v=t?{amt:t.amt,date:t.date,note:t.note||'',cat:t.cat,acct:t.acct||'',to:t.to||''}:{amt:'',date:TODAY,note:'',cat:txForm.type==='inc'?'salary':'groceries',acct:a,to:dest};

 (t&&(t.goal||t.debt)?'<p class="small muted">هذه المعاملة مرتبطة بـ'+(t.goal?'هدف ادخار':'دين')+' وسيتحدّث رصيده عند تغيير المبلغ.</p>':'')+
 '<div class="err" id="f-err"></div><div class="row"><button class="btn primary" type="submit">حفظ</button>'+(t?'':'<button class="btn" type="button" data-act="txAgain">حفظ وإضافة أخرى</button>')+'<button class="btn" type="button" data-act="closeModal">إلغاء</button></div></form>');

function saveTx(again){
 var f=readTxVals(),amt=parseFloat(f.amt),err=$('#f-err'),type=txForm.type;
 if(!(amt>0)){err.textContent='أدخل مبلغاً أكبر من صفر.';return}
 if(!f.date){err.textContent='اختر التاريخ.';return}
 var note=f.note.trim(),touched=[];
 if(type==='xfer'&&(!f.acct||!f.to||f.acct===f.to)){err.textContent='اختر حسابين مختلفين.';return}
 if(type!=='xfer'&&(!f.cat||f.cat==='__new')){err.textContent=f.cat==='__new'?'اكتب اسم التصنيف الجديد واضغط إضافة.':'اختر التصنيف.';return}
 var t;
 if(txForm.id){
  t=S.tx.filter(function(x){return x.id===txForm.id})[0];
  touched.push(t.date.slice(0,7));
  if(t.type==='exp'&&type==='exp')linkAdjust(t,amt-t.amt);
  t.amt=amt;t.date=f.date;t.note=note;t.type=type;
  if(type==='xfer'){t.cat='';t.acct=f.acct;t.to=f.to;delete t.bucket}
  else{
   if(t.bucket&&catById(f.cat)&&catById(f.cat).bucket!==t.bucket&&!t.reviewed)delete t.bucket;
   t.cat=f.cat;delete t.to;
   if($('#f-acct')){if(f.acct)t.acct=f.acct;else delete t.acct}
  }
 }else{
  t={id:genId(),date:f.date,amt:amt,type:type,cat:type==='xfer'?'':f.cat,note:note,reviewed:type!=='exp'};
  if(type==='xfer'){t.acct=f.acct;t.to=f.to}else if(f.acct)t.acct=f.acct;
  S.tx.push(t);
 }
 touched.push(f.date.slice(0,7));
 if(t.acct)ui.lastAcct=t.acct;
 var lc=$('#f-learn'),msg='تم الحفظ';
 if(type!=='xfer'&&lc&&lc.checked&&note&&learnRule(note,f.cat)){
  var n=0,key=note.toLowerCase();
  S.tx.forEach(function(x){if(x.id!==t.id&&x.type===type&&(x.note||'').trim().toLowerCase()===key&&x.cat!==f.cat){x.cat=f.cat;if(x.bucket&&x.type==='exp'){var cc=catById(f.cat);if(cc&&cc.bucket!=='income')x.bucket=cc.bucket}touched.push(x.date.slice(0,7));n++}});
  persist('meta');
  msg='سأصنّف «'+note+'» في '+catById(f.cat).name+' تلقائياً'+(n?' وحدّثت '+n+' معاملة سابقة':'');
 }
 touched.filter(function(m,i,a){return a.indexOf(m)===i}).forEach(function(m){persist('tx:'+m)});
 if(t.goal||t.debt)persist('meta');
 if(again){toast(msg);openTx(null,type);$('#f-date').value=f.date}else{closeModal();toast(msg)}
 render();
}

 if(!p){toast('أضف المبلغ كرقم');return}
 var auto=autoCat(p.note,p.type),sel=$('#qa-cat'),cat=ui.qaTouched?ui.qaCat:(auto||'');
 if(sel&&sel.value)cat=sel.value;
 if(!cat){if(sel)sel.focus();toast('اختر التصنيف أولاً');return}
 var matched=!ui.qaTouched&&!!auto&&auto===cat;
 var t={id:genId(),date:p.date,amt:p.amt,type:p.type,cat:cat,note:p.note,reviewed:p.type==='inc'||matched};
 var ac=defAcct();if(ac)t.acct=ac;

}

/* weekly review */
function openReview(){
 var n=reviewQueue().length;
 ui.review={skip:{},total:n,done:0};
 if(!n){toast('لا توجد معاملات للمراجعة');ui.review=null;return}
 paintReview();
}
function paintReview(){
 var q=reviewQueue(),r=ui.review;if(!r)return;
 if(!q.length){
  var done=r.done;closeModal();toast(done?'اكتملت المراجعة. صنّفت '+done+' معاملة':'انتهت المراجعة');render();return;
 }
 var t=q[0],c=catById(t.cat),keep=r;
 $('#layer').innerHTML='<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">'+mHead('المراجعة الأسبوعية')+
 '<div class="rv"><div class="small muted">'+(r.done+1)+' من '+r.total+'</div><div class="bar"><i style="width:'+(r.done/r.total*100)+'%"></i></div><div><div class="amt">'+money(t.amt)+'</div><div style="font-weight:600">'+esc(t.note||(c?c.name:''))+'</div><div class="muted small">'+esc(c?c.name:'')+' · '+dfmt(t.date)+'</div></div>'+
 '<label class="f" style="text-align:start">التصنيف<select class="in" id="rv-cat">'+catOptions(t.cat,'exp',1)+'</select></label>'+
 '<div class="btns"><button data-act="rv" data-b="needs"><span>→ احتياج</span><small>ضروري</small></button><button data-act="rv" data-b="wants"><span>← رغبة</span><small>اختياري</small></button><button data-act="rv" data-b="savings"><span>↓ ادخار</span><small>للمستقبل</small></button></div>'+
 '<div class="row" style="justify-content:center"><button class="btn sm" data-act="rv" data-b="same">صحيح كما هو ('+BK[bucketOf(t)].short+')</button><button class="btn sm" data-act="rv" data-b="skip">تخطَّ ↑</button></div><div class="small muted">يمكنك استخدام الأسهم في لوحة المفاتيح.</div></div></div></div>';
 ui.review=keep;
}
function reviewAct(b){
 var q=reviewQueue();if(!q.length||!ui.review)return;
 var t=q[0];
 if(b==='skip'){ui.review.skip[t.id]=1;ui.review.done++;paintReview();return}
 var sel=$('#rv-cat'),nc=sel?sel.value:t.cat,changed=nc!==t.cat;
 if(nc==='__new'){toast('اكتب اسم التصنيف الجديد واضغط إضافة');return}
 if(changed){t.cat=nc;var cc=catById(nc);if(cc&&cc.bucket!=='income')t.bucket=cc.bucket;if(t.note&&learnRule(t.note,nc))persist('meta')}
 if(b!=='same'){t.bucket=b}
 t.reviewed=true;ui.review.done++;persist('tx:'+t.date.slice(0,7));paintReview();
}

/* ---------- bank statement import (csv / xlsx / pdf) ---------- */
var LIBS={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'};
function loadJs(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=function(){res()};s.onerror=function(){rej(new Error('load'))};document.head.appendChild(s)})}
function readXlsx(buf){
 return loadJs(LIBS.xlsx).then(function(){
  var wb=XLSX.read(buf,{type:'array',cellDates:true}),best=null;
  wb.SheetNames.forEach(function(n){
   var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
   if(!best||rows.length>best.length)best=rows;
  });
  return (best||[]).map(function(r){return r.map(function(v){
   if(v instanceof Date){var d=new Date(v.getTime()+43200000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
   return typeof v==='number'?String(v):String(v==null?'':v);
  })}).filter(function(r){return r.some(function(c){return c.trim()!==''})});
 });
}
function readPdf(buf){
 return loadJs(LIBS.pdf).then(function(){
  var lib=window.pdfjsLib;
  if(lib.GlobalWorkerOptions.workerSrc)return lib;
  /* worker as a blob; if the fetch is blocked, load the worker as a script and let pdf.js run it on the main thread */
  return fetch(LIBS.pdfw).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));return lib})
   .catch(function(){return loadJs(LIBS.pdfw).then(function(){lib.GlobalWorkerOptions.workerSrc=LIBS.pdfw;return lib})});
 }).then(function(lib){
  return lib.getDocument({data:new Uint8Array(buf)}).promise.then(function(pdf){
   var lines=[],chain=Promise.resolve(),chars=0;
   for(var p=1;p<=Math.min(pdf.numPages,80);p++)(function(p){
    chain=chain.then(function(){return pdf.getPage(p)}).then(function(pg){return pg.getTextContent()}).then(function(tc){
     var its=tc.items.filter(function(it){return it.str&&it.str.trim()}).map(function(it){chars+=it.str.length;return {x:it.transform[4],y:it.transform[5],s:it.str}});
     its.sort(function(a,b){return b.y-a.y});
     var groups=[];
     its.forEach(function(it){var g=groups[groups.length-1];if(g&&Math.abs(g.y-it.y)<=4)g.items.push(it);else groups.push({y:it.y,items:[it]})});
     groups.forEach(function(g){
      var txt=g.items.map(function(i){return i.s}).join('');
      var ar=(txt.match(/[\u0600-\u06FF]/g)||[]).length,lat=(txt.match(/[A-Za-z]/g)||[]).length;
      g.items.sort(function(a,b){return ar>lat?b.x-a.x:a.x-b.x});
      lines.push(g.items.map(function(i){return i.s}).join(' '));
     });
    });
   })(p);
   return chain.then(function(){return {rows:pdfLinesToRows(lines),chars:chars,lines:lines}});
  });
 });
}
function openPaste(msg){
 openModal(mHead('لصق نص الكشف')+'<p class="muted small">'+(msg||'')+' افتح كشف الحساب في أي قارئ PDF، حدد كل النص (Ctrl+A أو تحديد الكل)، انسخه، ثم الصقه هنا. يعمل أيضاً مع جدول منسوخ من Excel.</p>'+
  '<textarea class="in" id="paste-txt" rows="9" placeholder="الصق هنا…" style="font-size:13px"></textarea><div class="err" id="paste-err"></div>'+
  '<div class="row"><button class="btn primary" data-act="pasteGo">قراءة النص</button><button class="btn" data-act="closeModal">إلغاء</button></div>');
 var t=$('#paste-txt');if(t)t.focus();
}
function pasteGo(){
 var txt=($('#paste-txt').value||'').trim(),err=$('#paste-err');
 if(txt.length<20){err.textContent='الصق نص الكشف أولاً.';return}
 var lines=txt.split(/\r?\n/),tabs=lines.filter(function(l){return l.indexOf('\t')>=0}).length,rows=[];
 if(tabs>=lines.length*.5){rows=parseCsv(txt)}
 if(rows.length<2)rows=pdfLinesToRows(lines);

 if(AI.fn&&(AI.force||rows.length<2)){aiReadStatement({text:txt},'كشف الحساب');return}
 if(rows.length<2){err.textContent='لم أجد معاملات بتاريخ ومبلغ في هذا النص. تأكد أنك نسخت جدول المعاملات.';return}
 openImport(rows,{name:'كشف الحساب',kind:'paste'});
}
function readStatement(f){
 var name=f.name.replace(/\.[^.]+$/,''),ext=(f.name.match(/\.([^.]+)$/)||[])[1]||'';ext=ext.toLowerCase();
 var fail=function(){toast('تعذر قراءة الملف. جرّب تصديره من البنك بصيغة CSV أو Excel')};
 if(ext==='xlsx'||ext==='xls'||ext==='pdf'){
  toast('جارٍ قراءة الكشف…');
  f.arrayBuffer().then(function(buf){return ext==='pdf'?readPdf(buf):readXlsx(buf).then(function(rows){return {rows:rows}})}).then(function(r){
   var rows=r.rows;
   if(ext==='pdf'&&r.chars>=30&&AI.fn&&(AI.force||!rows||rows.length<2)){aiReadStatement({text:r.lines.join('\n')},name);return}
   if(ext==='pdf'&&r.chars<30){openPaste('هذا الـPDF صورة ممسوحة ولا يحتوي نصاً، فلا أستطيع قراءته. اطلب من البنك نسخة Excel أو CSV، أو');return}
   if(!rows||rows.length<2){
    if(ext==='pdf'){openPaste('لم أتعرف على جدول المعاملات في الملف.');return}
    toast('لم أجد معاملات في الملف');return;
   }
   openImport(rows,{name:name,kind:ext});
  }).catch(function(){if(ext==='pdf')openPaste('تعذر فتح الـPDF مباشرة.');else fail()});
 }else{
  var rd=new FileReader();rd.onload=function(){openImport(String(rd.result),{name:name,kind:'csv'})};rd.onerror=fail;rd.readAsText(f);
 }
}
function openImport(src,meta){
 meta=meta||{};
 var rows=typeof src==='string'?parseCsv(src):src;
 if(rows.length<2){toast('لم أجد صفوفاً في الملف');return}
 var st=findStart(rows);rows=rows.slice(st.i);
 var hdr=rows[0].map(function(h){return String(h).trim()});
 var find=function(re){for(var i=0;i<hdr.length;i++)if(re.test(hdr[i]))return i;return -1};
 var hasHeader=st.hdr;
 var map={date:find(/تاريخ|date/i),desc:find(/وصف|بيان|تفاصيل|description|details|memo|narrat|merchant|payee|reference/i),amt:find(/مبلغ|amount|قيمة|value/i),deb:find(/مدين|سحب|debit|withdraw/i),cre:find(/دائن|إيداع|ايداع|credit|deposit/i),bal:find(/رصيد|balance/i)};
 if(!hasHeader){
  var r0=rows[0];map={date:-1,desc:-1,amt:-1,deb:-1,cre:-1,bal:-1};
  r0.forEach(function(c,i){if(map.date<0&&pDate(c,'dmy'))map.date=i;else if(map.amt<0&&!isNaN(numOf(c))&&/\d/.test(c)&&i!==map.date)map.amt=i;else if(map.amt>=0&&map.bal<0&&!isNaN(numOf(c))&&/\d/.test(c))map.bal=i});
  r0.forEach(function(c,i){if(map.desc<0&&i!==map.date&&i!==map.amt&&i!==map.bal&&/\D/.test(c))map.desc=i});
 }
 map.typ=-1;
 if(map.amt>=0&&(map.amt===map.deb||map.amt===map.cre||map.amt===map.bal))map.amt=-1;
 if(map.date>=0&&map.date===map.desc)map.desc=-1;
 var body=hasHeader?rows.slice(1):rows;
 var fmt=guessFmt(body,Math.max(0,map.date));
 if(map.amt>=0&&map.deb<0&&map.cre<0){
  /* a column of words like مدين/دائن or Debit/Credit tells the direction */
  for(var ci=0;ci<rows[0].length+2&&map.typ<0;ci++){
   if([map.date,map.amt,map.bal,map.desc].indexOf(ci)>=0)continue;
   var vals=body.slice(0,80).map(function(r){return String(r[ci]||'').trim()}).filter(function(v){return v&&v.length<30});
   if(vals.length>=3&&vals.filter(function(v){return dirOf(v)}).length>=vals.length*.7)map.typ=ci;
  }
 }
 var signed=map.typ>=0?0:fixSigns(rows,hasHeader?1:0,map,fmt);
 ui.imp={rows:rows,hasHeader:hasHeader,map:map,fmt:fmt,sign:'neg',hdr:hdr,ncol:Math.max.apply(null,rows.slice(0,50).map(function(r){return r.length})),name:meta.name||'',signed:signed,flip:{},catOv:{},flipAll:false};
 var opts=function(id,sel,optional){
  var o=optional?'<option value="-1"'+(sel<0?' selected':'')+'>بدون</option>':'';
  for(var i=0;i<ui.imp.ncol;i++){var name=hasHeader&&hdr[i]?hdr[i]:'عمود '+(i+1);o+='<option value="'+i+'"'+(sel===i?' selected':'')+'>'+esc(name)+'</option>'}
  return '<select class="in" id="'+id+'" data-on="impmap">'+o+'</select>';
 };
 var fresh=!S.accts.length||S.settings.demo,dflt=fresh?'__new':defAcct();

 var I=ui.imp;
 var g=function(id){var e=$('#'+id);return e?parseInt(e.value,10):-1};
 I.map={date:g('im-date'),desc:g('im-desc'),amt:g('im-amt'),deb:g('im-deb'),cre:g('im-cre'),bal:g('im-bal'),typ:g('im-typ')};
 I.fmt=$('#im-fmt').value;I.sign=$('#im-sign').value;I.hasHeader=$('#im-hdr').checked;
 var body=I.hasHeader?I.rows.slice(1):I.rows,items=[],bad=0,dups=0,balRows=[],M=I.map;
 var keys={};S.tx.forEach(function(t){keys[t.date+'|'+t.type+'|'+t.amt+'|'+(t.note||'').toLowerCase()]=1});
 var salaryCat=catById('salary')?'salary':(S.cats.filter(function(c){return c.bucket==='income'})[0]||{}).id;
 var sideCat=catById('side')?'side':salaryCat;
 var fall=catById('other')?'other':(S.cats.filter(function(c){return c.bucket==='wants'})[0]||S.cats[0]).id;
 /* single signed column? if no row has a sign or direction word, fall back to the description */
 var kw=false;
 if(M.amt>=0&&M.deb<0&&M.cre<0&&M.typ<0){
  var anyNeg=false,anyDir=false;
  body.forEach(function(r){var s=String(r[M.amt]||'');if(numOf(s)<0)anyNeg=true;if(dirOf(s))anyDir=true});
  kw=!anyNeg&&!anyDir;
 }
 I.kw=kw;
 body.forEach(function(r,idx){
  var date=M.date>=0?pDate(r[M.date]||'',I.fmt):null;
  var desc=M.desc>=0?String(r[M.desc]||'').trim().replace(/\s+/g,' '):'';
  if(date&&M.bal>=0){var bv=numOf(r[M.bal]);if(!isNaN(bv))balRows.push({date:date,bal:bv})}
  var type=null,amt=0;
  if(M.deb>=0||M.cre>=0){
   var d=M.deb>=0?Math.abs(numOf(r[M.deb])):NaN,c=M.cre>=0?Math.abs(numOf(r[M.cre])):NaN;
   if(d>0&&!(c>0)){type='exp';amt=d}else if(c>0&&!(d>0)){type='inc';amt=c}
   else if(d>0&&c>0){type=d>=c?'exp':'inc';amt=Math.abs(d-c)}
  }else if(M.amt>=0){
   var raw=String(r[M.amt]||''),a=numOf(raw);
   if(!isNaN(a)&&a!==0){
    amt=Math.abs(a);
    var dir=(M.typ>=0?dirOf(r[M.typ]):null)||dirOf(raw.replace(/[\d.,\s\-−–()]/g,' '));
    if(dir)type=dir;
    else if(kw)type=IN_KW.test(desc)?'inc':'exp';
    else{var exp=I.sign==='neg'?a<0:a>0;type=exp?'exp':'inc'}
   }
  }
  if(type&&I.flipAll)type=type==='exp'?'inc':'exp';
  if(type&&I.flip[idx])type=type==='exp'?'inc':'exp';
  if(!date||!type||!(amt>0)){bad++;return}
  amt=Math.round(amt*100)/100;
  var key=date+'|'+type+'|'+amt+'|'+desc.slice(0,80).toLowerCase();
  if(keys[key]){dups++;return}
  keys[key]=1;
  var mc=autoCat(desc,type),ov=I.catOv[idx];
  if(ov&&catById(ov)&&((catById(ov).bucket==='income')!==(type==='inc')))ov=null;
  var cat=ov||mc||(type==='inc'?(amt>=S.settings.income*.5?salaryCat:sideCat):fall);
  items.push({idx:idx,date:date,type:type,amt:amt,note:desc.slice(0,80),cat:cat,matched:!!(mc||ov),manual:!!ov});
 });
 I.closing=null;I.closeDate='';
 if(balRows.length){
  var desc2=balRows[0].date>balRows[balRows.length-1].date,best=null;
  balRows.forEach(function(b){if(!best||b.date>best.date||(b.date===best.date&&!desc2))best=b});
  I.closing=best.bal;I.closeDate=best.date;
 }
 I.items=items;I.bad=bad;I.dups=dups;
 return I;
}

 income:function(el){var v=parseFloat(el.value);if(v>=0){S.settings.income=v;metaDeferred()}},
 split:function(el){var v=Math.max(0,Math.min(100,parseFloat(el.value)||0));S.settings.split[el.getAttribute('data-k')]=v;metaDeferred()},
 catname:function(el){var c=catById(el.getAttribute('data-id'));var v=el.value.trim();if(c&&v){c.name=v;persist('meta')}else if(c)el.value=c.name},
 catbudget:function(el){var c=catById(el.getAttribute('data-id'));var v=parseFloat(el.value);if(c){c.budget=v>0?v:0;metaDeferred()}},
 cur:function(el){S.settings.cur=el.value;metaDeferred()},
 theme:function(el){S.settings.theme=el.value;applyTheme();persist('meta')},
 extra:function(el){ui.extra=Math.max(0,parseFloat(el.value)||0);deferRender()},
 subType:function(el){$('#s-cat').innerHTML=catOptions(el.value==='inc'?'salary':'fun',el.value,1)},
 import:function(el){
  var f=el.files&&el.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
   try{
    var o=JSON.parse(rd.result);
    if(!o||!Array.isArray(o.cats)||!Array.isArray(o.tx)||!o.settings)throw new Error('x');
    o.tx=o.tx.filter(function(t){return t&&typeof t.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&t.amt>=0});
    var om=txMonths();S=normalize(o);S.settings.onboarded=true;
    persistAll(om);applyTheme();render();toast('تمت الاستعادة');
   }catch(e){var er=$('#imperr');if(er)er.textContent='الملف غير صالح. استخدم نسخة احتياطية صدّرتها من ميزان.'}
  };
  rd.readAsText(f);
 }
};

document.addEventListener('click',function(e){
 if(ui.pend)setTimeout(flushRender,0);
 var a=e.target.closest('[data-act]');if(!a)return;
 var f=ACT[a.getAttribute('data-act')];if(f){f(a,e)}
});
document.addEventListener('change',function(e){
 if(e.target&&e.target.tagName==='SELECT'&&e.target.value==='__new'){showNewCat(e.target);return}
 var a=e.target.closest('[data-on]');if(!a)return;
 var f=ON[a.getAttribute('data-on')];if(f)f(a,e);
});
document.addEventListener('input',function(e){
 var id=e.target&&e.target.id;
 if(id==='q'){ui.q=e.target.value;ui.limit=60;var l=$('#txlist');if(l)l.innerHTML=txListHtml()}
 else if(id==='qa'){ui.qaText=e.target.value;ui.qaTouched=false;qaPreview()}
 else if(id==='f-note'&&!txForm.touched&&txForm.type!=='xfer'){
  var c=autoCat(e.target.value,txForm.type),sel=$('#f-cat');
  if(c&&sel)sel.value=c;
 }
 else if(id==='pl-inc'){ui.plan.inc=Math.max(0,parseFloat(e.target.value)||0);plPaint()}
 else if(e.target.getAttribute&&e.target.getAttribute('data-rb')){var tg=S.settings.invTarget=S.settings.invTarget||{};tg[e.target.getAttribute('data-rb')]=Math.max(0,parseFloat(e.target.value)||0);rbPaint();clearTimeout(ui.cct);ui.cct=setTimeout(function(){persist('meta')},800)}
 else if(e.target.getAttribute&&e.target.getAttribute('data-rbm')){ui.rbm=e.target.value;rbPaint()}
 else if(e.target.getAttribute&&e.target.getAttribute('data-cc')){var cc=calcState();cc[e.target.getAttribute('data-cc')]=parseFloat(e.target.value)||0;calcPaint();clearTimeout(ui.cct);ui.cct=setTimeout(function(){persist('meta')},800)}
 else if(e.target.getAttribute&&e.target.getAttribute('data-pl'))planMove(e.target.getAttribute('data-pl'),parseFloat(e.target.value));
});
document.addEventListener('submit',function(e){
 e.preventDefault();
 var id=e.target.id;
 if(id==='txf')saveTx(false);
 else if(id==='hf')saveHolding();
 else if(id==='tf')saveTrade();
 else if(id==='prf')savePrices();
 else if(id==='gf'){
  var name=$('#g-name').value.trim(),target=parseFloat($('#g-target').value),saved=parseFloat($('#g-saved').value)||0,dl=$('#g-dl').value,cat=$('#g-cat').value;
  if(!name||!(target>0)){$('#g-err').textContent='اكتب اسم الهدف ومبلغاً مستهدفاً صحيحاً.';return}
  if(ui.editId){var g=goalById(ui.editId);g.name=name;g.target=target;g.saved=saved;g.deadline=dl;g.cat=cat}
  else S.goals.push({id:genId(),name:name,target:target,saved:saved,deadline:dl,cat:cat});
  closeModal();mutateMeta();
 }else if(id==='cf'){
  var amt=parseFloat($('#c-amt').value),date=$('#c-date').value,g2=goalById(ui.editId);
  if(!(amt>0)||!g2){$('#c-err').textContent='أدخل مبلغاً صحيحاً.';return}
  g2.saved+=amt;
  S.tx.push({id:genId(),date:date,amt:amt,type:'exp',cat:g2.cat||'emergency',note:'مساهمة: '+g2.name,goal:g2.id,bucket:'savings',reviewed:true});
  persist('tx:'+date.slice(0,7));closeModal();mutateMeta();toast('أُضيفت المساهمة');
 }else if(id==='sf'){
  var o={name:$('#s-name').value.trim(),type:$('#s-type').value,amt:parseFloat($('#s-amt').value),cycle:$('#s-cycle').value,day:Math.max(1,Math.min(31,parseInt($('#s-day').value,10)||1)),month:+$('#s-month').value,cat:$('#s-cat').value,active:true};
  if(o.cat==='__new'){$('#s-err').textContent='اكتب اسم التصنيف الجديد واضغط إضافة.';return}
  if(!o.name||!(o.amt>0)){$('#s-err').textContent='اكتب الاسم والمبلغ.';return}
  if(ui.editId){var x=S.subs.filter(function(s){return s.id===ui.editId})[0];o.active=x.active;Object.assign(x,o)}
  else{o.id=genId();S.subs.push(o)}
  closeModal();mutateMeta();
 }else if(id==='af'){
  var an=$('#a-name').value.trim(),ao=parseFloat($('#a-open').value),as=$('#a-since').value;
  if(!an||isNaN(ao)||!as){$('#a-err').textContent='اكتب اسم الحساب والرصيد وتاريخ البدء.';return}
  var ao2={name:an,kind:$('#a-kind').value,open:ao,since:as};
  if(ui.editId)Object.assign(acctById(ui.editId),ao2);else{ao2.id=genId();S.accts.push(ao2)}
  closeModal();mutateMeta();
 }else if(id==='rf'){
  var a3=acctById(ui.editId),tb=parseFloat($('#r-bal').value);
  if(!a3||isNaN(tb))return;
  a3.open=(+a3.open||0)+(tb-acctBalance(a3));
  closeModal();mutateMeta();toast('تمت التسوية');
 }else if(id==='df'){
  var dn=$('#d-name').value.trim(),db=parseFloat($('#d-bal').value),dr=parseFloat($('#d-rate').value)||0,dm=parseFloat($('#d-min').value)||0;
  if(!dn||!(db>=0)){$('#d-err').textContent='اكتب اسم الدين ورصيده.';return}
  if(ui.editId){var d0=debtById(ui.editId);d0.name=dn;d0.balance=db;d0.rate=dr;d0.min=dm;if(db>(d0.start||0))d0.start=db}
  else S.debts.push({id:genId(),name:dn,balance:db,start:db,rate:dr,min:dm});
  closeModal();mutateMeta();
 }else if(id==='pf'){
  var d1=debtById(ui.editId),pa=parseFloat($('#p-amt').value),pd=$('#p-date').value,pac=$('#p-acct')?$('#p-acct').value:'';
  if(!d1||!(pa>0)||!pd){$('#p-err').textContent='أدخل مبلغاً وتاريخاً صحيحين.';return}
  var pt={id:genId(),date:pd,amt:pa,type:'exp',cat:'loans',note:'دفعة: '+d1.name,debt:d1.id,bucket:'needs',reviewed:true};
  if(pac)pt.acct=pac;
  S.tx.push(pt);linkAdjust(pt,pa);
  persist('tx:'+pd.slice(0,7));closeModal();mutateMeta();toast('سُجّلت الدفعة');
 }
});
document.addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('fh')){e.preventDefault();e.target.click();return}
 if(e.key==='Enter'&&e.target&&e.target.id==='ai-in'){e.preventDefault();var b=document.querySelector('[data-act="aiSend"]');if(b)b.click();return}
 if(e.key==='Enter'&&e.target&&e.target.id==='qa'){e.preventDefault();qaSave();return}
 if(e.key==='Escape'&&!ui.ob&&$('#layer')&&$('#layer').firstChild){closeModal();return}
 if(ui.review&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){
  var m={ArrowRight:'needs',ArrowLeft:'wants',ArrowDown:'savings',ArrowUp:'skip'}[e.key];
  if(m){e.preventDefault();reviewAct(m)}
 }
});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(drawCharts,150)});

/* ---------- boot ---------- */
var local=loadLocal();
if(local){S=local}else{S=blankState();S.settings.onboarded=false}
try{ui.fold=JSON.parse(localStorage.getItem('mizan.fold')||'{}')}catch(e){ui.fold={}}
autoSubs();
applyTheme();
shell();
render();
aiInit();
connect().then(function(){if(S.settings.onboarded===false&&!sync.remoteHas)openOnboarding()});
})();
</script>

</body></html>
